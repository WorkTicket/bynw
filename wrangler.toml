name = "bynmwcreative"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = false

routes = [
  { pattern = "bynmwcreative.com", custom_domain = true },
  { pattern = "www.bynmwcreative.com", custom_domain = true },
]

[assets]
directory = "./out"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

